apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 */
react {
    autolinkLibrariesWithApp()
}

/**
 * Proguard switch (release)
 */
def enableProguardInReleaseBuilds = false

/**
 * Preferred JSC flavor
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.monezacli"
    defaultConfig {
        applicationId "com.monezacli"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is provided by the RN Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Kotlin stdlib - keep in sync with kotlinVersion below
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
}

/*
 *  ======= Buildscript (explicit versions) =======
 *
 *  This block forces the Gradle plugin and Kotlin plugin versions to be explicit
 *  and consistent with the Kotlin metadata (2.2.x) found in your Gradle distribution.
 */
buildscript {
    ext {
        // Platform / compile versions (keep in sync with your rootProject ext usage)
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"

        // Kotlin 2.2.x family (match jars which were 2.2.x in your logs)
        // Use a stable patch release in the 2.2 family. 2.2.10 is chosen here.
        kotlinVersion = "2.2.10"

        // Android Gradle Plugin compatible with Gradle 9.x
        agpVersion = "8.4.2"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // explicit AGP
        classpath("com.android.tools.build:gradle:${agpVersion}")

        // kotlin gradle plugin pinned to 2.2.x
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")

        // React Native Gradle Plugin (leave unspecified version so it uses node_modules plugin)
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
